<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Universe</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  background: #080014;
  color: white;
}

.background {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -1;
}

.orb {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(90px);
  animation: float 8s infinite alternate ease-in-out;
}

.orb:nth-child(1) {
  background: #8b00ff;
  top: 5%;
  left: 10%;
}

.orb:nth-child(2) {
  background: #00d9ff;
  bottom: 5%;
  right: 10%;
  animation-delay: -3s;
}

.orb:nth-child(3) {
  background: #ff00a8;
  top: 40%;
  left: 45%;
  animation-delay: -5s;
}

@keyframes float {
  from { transform: translate(0,0) scale(1); }
  to { transform: translate(80px,-60px) scale(1.3); }
}

.card {
  width: 90%;
  max-width: 420px;
  padding: 45px 30px;
  text-align: center;
  border: 1px solid #ffffff30;
  border-radius: 25px;
  background: #ffffff12;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 50px #9d00ff25;
  animation: appear 1.2s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(60px) scale(.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.icon {
  font-size: 65px;
  margin-bottom: 20px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.2) rotate(10deg); }
}

h1 {
  font-size: 36px;
  background: linear-gradient(90deg,#00eaff,#d400ff,#ff00a8);
  background-clip: text;
  color: transparent;
  margin-bottom: 15px;
}

p {
  color: #d5c9e9;
  line-height: 1.7;
  margin-bottom: 25px;
}

button {
  padding: 14px 35px;
  border: none;
  border-radius: 30px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(90deg,#7b00ff,#ed00c8);
  box-shadow: 0 0 20px #b000ff80;
  transition: .3s;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 35px #ed00ff;
}

#message {
  margin-top: 25px;
  color: #00eaff;
  font-size: 18px;
  min-height: 28px;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.5); }
}
</style>
</head>
<body>

<div class="background">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<div class="stars" id="stars"></div>

<div class="card">
  <div class="icon">🚀</div>
  <h1>NEON WORLD</h1>
  <p>
    Kelajak olamiga xush kelibsan!
    Bu yerda tasavvur va texnologiya
    birlashadi.
  </p>
  <button onclick="magic()">BOSIB KO'R ✨</button>
  <div id="message"></div>
</div>

<script>
const messages = [
  "✨ Sen ajoyibsan!",
  "🚀 Kelajak sari olg'a!",
  "💜 Hech qachon to'xtama!",
  "🌌 Orzularingga ishon!",
  "🔥 Sen uddalaysan!"
];

function magic() {
  const random = Math.floor(Math.random() * messages.length);
  document.getElementById("message").textContent =
    messages[random];
}

// Yulduzlarni yaratish
const stars = document.getElementById("stars");

for (let i = 0; i < 100; i++) {
  const star = document.createElement("div");
  star.className = "star";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDelay = Math.random() * 3 + "s";
  stars.appendChild(star);
}
</script>

</body>
</html>
